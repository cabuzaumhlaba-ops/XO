
name: Build XO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract XO source
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir extracted
          unzip -q XO.zip -d extracted
          test -f extracted/XO/gradlew
          chmod +x extracted/XO/gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Run unit tests
        working-directory: extracted/XO
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build XO APK
        working-directory: extracted/XO
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XO-Android-APK
          path: extracted/XO/app/build/outputs/apk/debug/app-debug.apk
